<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stellar Nova</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="stylesheet" href="_ds/nocturne-8bdd021c-a251-4936-b8da-dc4de67bfe9c/styles.css">
<script src="_ds/nocturne-8bdd021c-a251-4936-b8da-dc4de67bfe9c/_ds_bundle.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stellar-f.css">
<style>html,body{margin:0}</style>
</helmet>
<div class="f {{ theme }}">
  <div style="flex:none;width:{{ railSlot }};transition:width 240ms cubic-bezier(.2,.8,.2,1);position:sticky;top:0;height:100vh;z-index:20;">
  <aside aria-label="Main navigation" onMouseEnter="{{ railEnter }}" onMouseLeave="{{ railLeave }}" style="position:absolute;top:0;left:0;height:100%;background:var(--rail);width:{{ railW }};box-shadow:{{ railShadow }};display:flex;flex-direction:column;gap:4px;padding:16px 12px;box-sizing:border-box;border-right:1px solid var(--ln);transition:width 240ms cubic-bezier(.2,.8,.2,1), box-shadow 240ms;overflow:hidden;">
    <div style="display:flex;align-items:center;gap:10px;height:44px;padding:0 4px;margin-bottom:12px;white-space:nowrap;">
      <img src="assets/stellar-mark-frost.png" alt="" style="width:36px;height:36px;object-fit:contain;flex:none;">
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05;opacity:{{ labelOp }};transition:opacity 180ms;"><span style="font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:600;letter-spacing:-0.01em;">Stellar</span><span style="font-size:13px;font-weight:600;color:var(--mu);">Learning</span></span>
      <button onClick="{{ toggleRail }}" title="Pin sidebar" aria-label="Pin sidebar" style="flex:none;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--mu);cursor:pointer;opacity:{{ labelOp }};transition:opacity 180ms;" style-hover="background:var(--hov);color:var(--ink);"><i class="ph ph-sidebar-simple" style="font-size:18px;"></i></button>
    </div>
    <div style="display:flex;align-items:center;gap:{{ searchGap }};margin-bottom:14px;">
      <button onClick="{{ openSearch }}" title="Search (⌘K)" style="flex:{{ searchFlex }};width:{{ searchW }};min-width:0;box-sizing:border-box;display:flex;align-items:center;justify-content:{{ searchJust }};gap:{{ searchInGap }};height:{{ searchH }};padding:{{ searchPad }};border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--mu);cursor:pointer;font-size:14px;line-height:1;white-space:nowrap;overflow:hidden;" style-hover="border-color:var(--ln2);"><i class="ph ph-magnifying-glass" style="font-size:19px;line-height:1;flex:none;display:block;"></i><span style="flex:1;text-align:left;display:{{ labelDisp }};opacity:{{ labelOp }};transition:opacity 180ms;">Search</span><span style="font-size:12px;display:{{ labelDisp }};opacity:{{ labelOp }};transition:opacity 180ms;">⌘K</span></button>
      <button onClick="{{ openCreate }}" title="Create" aria-label="Create" style="flex:none;width:{{ plusW }};height:40px;display:grid;place-items:center;border:0;border-radius:12px;background:var(--ac);color:var(--onAc);cursor:pointer;overflow:hidden;transition:width 240ms cubic-bezier(.2,.8,.2,1), opacity 180ms;opacity:{{ labelOp }};" style-hover="background:var(--acH);"><i class="ph-bold ph-plus" style="font-size:17px;"></i></button>
    </div>
    <span style="height:20px;padding:0 11px;font-size:11px;font-weight:700;letter-spacing:0.08em;color:var(--mu);white-space:nowrap;opacity:{{ labelOp }};transition:opacity 180ms;">LEARN</span>
    <sc-for list="{{ nav }}" as="it" hint-placeholder-count="5">
      <button onClick="{{ it.go }}" title="{{ it.label }}" style="display:flex;align-items:center;gap:12px;height:42px;padding:0 11px;border:0;border-radius:12px;cursor:pointer;white-space:nowrap;background:{{ it.bg }};color:{{ it.color }};" style-hover="background:var(--hov);color:var(--ink);">
        <i class="{{ it.icon }}" style="font-size:21px;flex:none;"></i>
        <span style="flex:1;text-align:left;font-size:15px;font-weight:600;opacity:{{ labelOp }};transform:translateX({{ labelX }});transition:opacity 180ms, transform 240ms cubic-bezier(.2,.8,.2,1);">{{ it.label }}</span>
        <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;color:var(--mu);background:var(--acT);padding:2px 8px;border-radius:999px;opacity:{{ labelOp }};transition:opacity 180ms;">Assistant</span></sc-if>
      </button>
    </sc-for>
    <div style="margin-top:auto;padding-top:12px;border-top:1px solid var(--ln);">
      <button title="Alex" style="display:flex;align-items:center;gap:10px;width:100%;height:50px;padding:0 4px;border:0;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;text-align:left;" style-hover="background:var(--hov);">
        <span style="width:36px;height:36px;flex:none;border-radius:50%;background:var(--soft);color:var(--mu);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:600;">A</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;opacity:{{ labelOp }};transition:opacity 180ms;"><span style="font-size:14px;font-weight:600;">Alex</span><span style="font-size:12px;color:var(--mu);">alex</span></span>
        <i class="ph ph-caret-up-down" style="color:var(--mu);font-size:15px;opacity:{{ labelOp }};transition:opacity 180ms;"></i>
      </button>
    </div>
  </aside>
  </div>
  <div class="f-col">
    <header class="f-head">
      <span class="t-label" style="font-size:14px;">{{ crumb }}</span>
      <div style="margin-left:auto;"><dc-import name="StellarTopbar" prefix="{{ topPrefix }}" balance="{{ balanceChip }}" level="{{ s.level }}" days="{{ s.streak }}" hint-size="620px,40px"></dc-import></div>
    </header>
    <sc-if value="{{ anyPop }}" hint-placeholder-val="{{ false }}"><div onClick="{{ closePops }}" style="position:fixed;inset:0;z-index:9;"></div></sc-if>

    <main class="f-main" style="flex:1;">
      <div style="position:relative;display:flex;justify-content:flex-end;width:100%;max-width:780px;margin:0 auto;"><button class="btn quiet small" onClick="{{ toggleHistory }}" aria-expanded="{{ historyOpen }}"><i class="ph ph-clock-counter-clockwise"></i>History</button>
        <sc-if value="{{ historyOpen }}" hint-placeholder-val="{{ false }}"><div class="panel pad" style="position:absolute;top:42px;right:0;z-index:5;width:280px;border:1px solid var(--ln2);display:flex;flex-direction:column;gap:8px;"><div style="display:flex;align-items:center;"><b style="flex:1;font-weight:620;">Chat history</b><button class="btn quiet small" onClick="{{ newChat }}">New chat</button></div><span class="t-small">{{ historyEmpty }}</span><span class="t-label">Private chat</span></div></sc-if></div>
      <div class="nova">
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center;padding-top:4vh;"><img src="assets/stellar-mark-frost.png" alt="" style="width:52px;height:52px;object-fit:contain;"><h1>Let's lock in, Alex.</h1><span class="t-sub">{{ intro }}</span></div></sc-if>
        <sc-if value="{{ showSpots }}" hint-placeholder-val="{{ false }}"><section class="panel rows" aria-label="Where to start"><sc-for list="{{ spots }}" as="p" hint-placeholder-count="3"><button class="spot" onClick="{{ p.go }}"><span class="dot {{ p.cls }}"></span><span style="min-width:0;display:flex;flex-direction:column;"><span style="font-weight:600;">{{ p.title }}</span><span class="t-small">{{ p.why }}</span></span><span class="t-label">{{ p.tag }}</span></button></sc-for></section></sc-if>
        <sc-if value="{{ hasMsgs }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:14px;" aria-live="polite"><sc-for list="{{ msgs }}" as="m" hint-placeholder-count="2"><div class="msg {{ m.cls }}"><span>{{ m.text }}</span></div></sc-for></div></sc-if>
        <div class="composer"><textarea aria-label="Ask Nova" placeholder="Ask Nova" value="{{ draft }}" onInput="{{ setDraft }}" onKeyDown="{{ onKey }}"></textarea><div style="display:flex;align-items:center;gap:8px;"><button class="btn quiet small" disabled="{{ true }}"><i class="ph ph-paperclip"></i>Coming soon</button><span style="flex:1;"></span><button class="btn small" disabled="{{ cantSend }}" onClick="{{ send }}">Send</button></div></div>
        <span class="t-small" style="text-align:center;">Nova may make mistakes. Double check important info and report it as a bug.</span>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ true }}"><div class="suggest"><sc-for list="{{ suggest }}" as="sg" hint-placeholder-count="6"><button onClick="{{ sg.go }}">{{ sg.label }}</button></sc-for></div></sc-if>
      </div>
    </main>
    <nav class="f-review" aria-label="Sample student">
      <span>Sample data. Preview as:</span>
      <sc-for list="{{ asLinks }}" as="a" hint-placeholder-count="3"><a href="{{ a.href }}" aria-current="{{ a.on }}">{{ a.label }}</a></sc-for>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;railExpanded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">

const P = 'Stellar F Dark ', THEME = 'dark';
const AS = ['new', 'lapsed'].includes(new URLSearchParams(location.search).get('as')) ? new URLSearchParams(location.search).get('as') : 'active';
const STUDENT = {
  new: { level: 1, rank: 'Novice', xp: 0, next: 10, today: 0, streak: 0, best: 0, coins: 0, freeze: 0, revive: 0, week: 0, last: 0, q: 0, month: 0, time: '0m' },
  active: { level: 8, rank: 'Analyst', xp: 1240, next: 1700, today: 180, streak: 23, best: 23, coins: 340, freeze: 1, revive: 0, week: 9, last: 6, q: 42, month: 16, time: '11h 20m' },
  lapsed: { level: 8, rank: 'Analyst', xp: 1240, next: 1700, today: 0, streak: 0, best: 23, coins: 340, freeze: 0, revive: 1, week: 0, last: 9, q: 0, month: 9, time: '11h 20m' }
}[AS];
const asLinks = [['new', 'New student'], ['active', 'Active student'], ['lapsed', 'Missed a week']].map(([k, label]) => ({ label, on: String(k === AS), href: encodeURI(location.pathname.split('/').pop()) + '?as=' + k }));
const UNIT_DATA = [[1, "Limits and Continuity", "10–15%", 16], [2, "Differentiation: Definition and Basic Derivative Rules", "10–15%", 10], [3, "Differentiation: Composite, Implicit, and Inverse Functions", "9–13%", 6], [4, "Contextual Applications of Differentiation", "10–15%", 7], [5, "Analytical Applications of Differentiation", "15–18%", 12], [6, "Integration and Accumulation of Change", "17–20%", 14], [7, "Differential Equations", "6–12%", 9], [8, "Applications of Integration", "10–15%", 7]];
const UNITS = UNIT_DATA.map(([n, name, w, total], i) => { const done = AS === 'new' ? 0 : [16, 10, 6, 0, 0, 0, 0, 0][i]; return { label: 'Unit ' + n + ': ' + name, w: w + ' of the exam', count: done + ' of ' + total, pct: Math.round(done / total * 100) + '%' }; });
const REVIEW = [['1.5 Determining Limits Using Algebraic Properties of Limits', 'Last practiced 5 weeks ago'], ['1.9 Connecting Multiple Representations of Limits', 'You missed 2 of 3 on Tuesday'], ['2.5 Applying the Power Rule', 'Last practiced 3 weeks ago']].map(([title, why]) => ({ title, why }));
const MINE = [['AP® Calculus AB', 'assets/tn-calc-ab.png', '32 of 81 modules', '40%', '203 days until the exam'], ['AP® Biology', 'assets/tn-bio.png', '12 of 63 modules', '19%', 'Added 2 weeks ago'], ['AP® Microeconomics', 'assets/tn-micro.png', '1 of 36 modules', '3%', 'Added this week']].map(([title, img, meta, pct, note]) => ({ title, img, meta, pct, note }));
const NEXT = AS === 'lapsed' ? { head: 'Pick up with a review', title: REVIEW[0].title, btn: 'Review this module' } : { head: 'Continue where you left off', title: '4.1 Interpreting the Meaning of the Derivative in Context', btn: 'Continue' };
class Component extends DCLogic {
  state = { railOpen: null, railHover: false, pop: null, msgs: [], draft: '', historyOpen: false };
  shell(active, crumb) {
    const s = this.state, p = this.props;
    const pinned = s.railOpen ?? (p.railExpanded ?? false);
    const railOpen = pinned || s.railHover;
    const LINKS = Object.fromEntries(['Home','Courses','Shop','Leaderboard','Nova'].map(n => [n, P + n + '.dc.html' + location.search]));
    const nav = [['Home','house'],['Courses','graduation-cap'],['Shop','storefront'],['Leaderboard','ranking'],['Nova','star-four']].map(([label, ic]) => { const on = active === label;
      return { label, badge: label === 'Nova', icon: (on ? 'ph-fill ph-' : 'ph ph-') + ic, bg: on ? 'var(--navOn)' : 'transparent', color: on ? 'var(--acD)' : 'var(--mu)', go: () => { if (!on) location.href = encodeURI(LINKS[label]); } }; });
    return { railOpen, railW: railOpen ? '240px' : '68px', railSlot: pinned ? '240px' : '68px', nav, crumb: crumb || active,
      labelOp: railOpen ? 1 : 0, labelX: railOpen ? '0px' : '-6px', plusW: railOpen ? '40px' : '0px', searchGap: railOpen ? '8px' : '0px', searchFlex: railOpen ? '1' : 'none', searchW: railOpen ? 'auto' : '100%', searchJust: railOpen ? 'flex-start' : 'center', searchInGap: railOpen ? '10px' : '0px', searchH: railOpen ? '40px' : '42px', searchPad: railOpen ? '0 12px' : '0', labelDisp: railOpen ? 'inline' : 'none',
      railShadow: railOpen && !pinned ? '12px 0 32px rgba(20,24,40,0.10)' : 'none',
      railEnter: () => this.setState({ railHover: true }), railLeave: () => this.setState({ railHover: false }),
      toggleRail: () => this.setState({ railOpen: !pinned }),
      openSearch: () => window.dispatchEvent(new Event('stellar-search')), openCreate: e => { e.stopPropagation(); window.dispatchEvent(new CustomEvent('stellar-create', { detail: { rect: e.currentTarget.getBoundingClientRect() } })); }, anyPop: !!s.pop, closePops: () => this.setState({ pop: null }), balanceChip: String(STUDENT.coins) };
  }

  renderVals() {
    const s = this.state, ask = t => {
      const reply = 'Before I explain, what do you already know about this? Tell me your first step, even if you are not sure, and we will build from there.';
      this.setState({ msgs: [...s.msgs, { cls: 'me', text: t }, { cls: 'nv', text: reply }], draft: '' }); };
    const SUG = [['Draw a Graph', 'Draw a graph of y = x^2 - 4 and explain its key features.'], ['Write Code', 'Write a short Java method that reverses a string and explain it.'], ['Create a timeline', 'Create a timeline of the key events of the American Revolution.'], ['Plot a function', 'Help me plot f(x) = sin(x) / x and describe its limit at 0.'], ['Solve a physics problem', 'A ball is thrown up at 12 m/s. How high does it go?'], ['Explain a concept', 'Explain the chain rule like I am seeing it for the first time.']];
    const SPOTS = [['', '1.9 Connecting Multiple Representations of Limits', 'You missed 2 of 3 here on Tuesday', 'Needs review'], ['', '2.5 Applying the Power Rule', 'Last practiced 3 weeks ago', 'Review soon'], ['', 'Try 3 questions without Nova', 'See what you can do on your own, like on exam day', 'No help']];
    const canSend = !!s.draft.trim(); const empty = s.msgs.length === 0;
    return { ...this.shell('Nova'), theme: THEME, s: STUDENT, asLinks, topPrefix: THEME ? 'Stellar D Dark ' : 'Stellar D ', empty, hasMsgs: !empty, msgs: s.msgs, draft: s.draft, showSpots: empty && AS !== 'new',
      intro: AS === 'new' ? 'Ask anything. Once you add a course, Nova starts from what you are learning.' : 'Pick up where you got stuck, or ask anything.',
      spots: SPOTS.map(([cls, title, why, tag]) => ({ cls, title, why, tag, go: () => ask('Help me with ' + title + '.') })),
      suggest: SUG.map(([label, text]) => ({ label, go: () => ask(text) })),
      setDraft: e => this.setState({ draft: e.target.value }), cantSend: !canSend, send: () => canSend && ask(s.draft.trim()),
      onKey: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (canSend) ask(s.draft.trim()); } },
      historyOpen: s.historyOpen, toggleHistory: () => this.setState({ historyOpen: !s.historyOpen }), newChat: () => this.setState({ msgs: [], historyOpen: false }), historyEmpty: 'No past chats yet.' };
  }
}
</script>
</body>
</html>
